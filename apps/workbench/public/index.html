<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>VideoLab · 工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/lucide.js" defer></script>
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="工作区导航">
      <a class="brand" href="#templates"><span class="brand-mark"><i data-lucide="clapperboard"></i></span><span>VideoLab<small>创作工作台</small></span></a>
      <div class="sidebar-label">工作区</div>
      <nav id="navigation">
        <a href="#templates" data-view="templates"><i data-lucide="layout-grid"></i><span>模板库</span><span class="nav-count" id="template-count">…</span></a>
        <a href="#recipes" data-view="recipes"><i data-lucide="workflow"></i><span>流程库</span></a>
        <a href="#plan" data-view="plan"><i data-lucide="sliders-horizontal"></i><span>制作方案</span></a>
        <a href="#sources" data-view="sources"><i data-lucide="library"></i><span>来源与证据</span></a>
        <a href="#saved" data-view="saved"><i data-lucide="folder-open"></i><span>已存方案</span><span class="nav-count" id="saved-count">0</span></a>
      </nav>
      <div class="sidebar-label collection-label">资料集合</div>
      <div id="collections" class="collection-nav"></div>
      <div class="sidebar-bottom"><span class="local-dot"></span>本地工作区<span class="version">v0.1</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">工作区 <span>/</span> <strong id="breadcrumb">模板库</strong></div><div class="topbar-actions"><span class="status-label"><span class="local-dot"></span>本机资料</span><button class="icon-button" id="project-doc" aria-label="项目计划" title="项目计划"><i data-lucide="notebook-text"></i></button></div></header>
      <main id="main"><div class="loading-state"><i data-lucide="loader-circle"></i><span>正在读取目录</span></div></main>
    </div>
  </div>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="document-dialog" class="document-dialog" aria-labelledby="document-title"></dialog>
  <dialog id="compare-dialog" class="compare-dialog" aria-labelledby="compare-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
