<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VideoLab code-motion</title>
<style>
  html { font-size: 16px; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1411; }
  body { font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; color: #e9f1ec; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: radial-gradient(75rem 38rem at 20% 10%, var(--wash, #1c3a2e) 0%, #0d1411 62%, #080d0b 100%); }
  .grid { position: absolute; inset: 0; opacity: .15;
    background-image: linear-gradient(#7ea98f22 0.0625rem, transparent 0.0625rem), linear-gradient(90deg, #7ea98f22 0.0625rem, transparent 0.0625rem);
    background-size: 4rem 4rem; }
  .kicker { position: absolute; left: 6rem; top: 7rem; font-size: .95rem; letter-spacing: .32em; color: var(--accent-soft, #7fb79b); }
  h1 { position: absolute; left: 5.75rem; top: 9rem; margin: 0; font-size: 3.9rem; line-height: 1.16; font-weight: 650; }
  .sub { position: absolute; left: 6rem; top: 17rem; font-size: 1.32rem; color: #a9c9b8; line-height: 1.7; max-width: 60rem; }
  .cards { position: absolute; left: 6rem; right: 6rem; top: 22.5rem; display: flex; gap: 1.1rem; }
  .card { flex: 1 1 0; padding: 1.15rem 1.35rem; border: 0.0625rem solid #2c463a; border-radius: .7rem; background: #13211b; transition: none; }
  .card .num { font: 600 .8rem/1 Consolas, monospace; color: var(--accent-soft, #7fb79b); letter-spacing: .14em; }
  .card h2 { margin: .7rem 0 .35rem; font-size: 1.32rem; font-weight: 600; }
  .card p { margin: 0; font-size: .82rem; color: #8ba895; line-height: 1.65; }
  .card.on { border-color: var(--accent, #58b184); background: #173126; box-shadow: 0 0 0 .0625rem #58b18433, 0 .75rem 2.5rem #1f6f4f22; }
  .bar { position: absolute; left: 6rem; right: 6rem; bottom: 8rem; height: .375rem; background: #24362d; border-radius: 6rem; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3f9d72, #8fe0b3); }
  .hud { position: absolute; right: 2.5rem; top: 2rem; text-align: right; font: .7rem/1.9 Consolas, monospace; color: #739184; }
  .hud b { color: #c7e5d5; font-weight: 600; }
  .foot { position: absolute; left: 6rem; bottom: 4.5rem; font: .75rem/1.6 Consolas, monospace; color: #6f8b7d; }
  .spec { position: absolute; inset: 0; display: grid; place-items: center; background: #0b110ee6; opacity: 0; }
  .spec-inner { text-align: center; }
  .spec-inner .big { font-size: 2.4rem; font-weight: 600; letter-spacing: .04em; line-height: 1.3; }
  .spec-inner .small { margin-top: 1rem; font: .9rem/1.9 Consolas, monospace; color: #9cc2ae; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="cards" id="cards"></div>
  <div class="bar"><i id="progress"></i></div>
  <div class="hud">
    <div>t <b id="ht">0.00</b> s · frame <b id="hf">0</b></div>
    <div id="hspec"></div>
    <div>renderer: chromium + ffmpeg</div>
  </div>
  <div class="foot" id="foot"></div>
  <div class="spec" id="spec"><div class="spec-inner"><div class="big" id="spectitle"></div><div class="small" id="specsmall"></div></div></div>
</div>
<script>
  const CONTENT = __CONTENT_JSON__;
  const FPS = CONTENT.fps, DURATION = CONTENT.duration, WIDTH = CONTENT.width, HEIGHT = CONTENT.height;
  const TOTAL = Math.round(DURATION * FPS);
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const ramp = (t, start, len) => clamp01((t - start) / len);
  const setText = (id, value) => { document.getElementById(id).textContent = value; };
  const stepStart = (i, n) => DURATION * (0.22 + (i * (0.56 / Math.max(1, n))));
  function layout() {
    document.documentElement.style.fontSize = (innerWidth / 1280) * 16 + 'px';
    document.getElementById('stage').style.setProperty('--accent', CONTENT.accent || '#58b184');
    document.getElementById('stage').style.setProperty('--accent-soft', CONTENT.accentSoft || '#7fb79b');
    document.getElementById('stage').style.setProperty('--wash', CONTENT.wash || '#1c3a2e');
    setText('kicker', CONTENT.kicker || 'VIDEOLAB / CODE-MOTION');
    setText('title', CONTENT.title || '');
    setText('hspec', `${WIDTH}×${HEIGHT} · ${FPS} fps · ${DURATION.toFixed(1)} s`);
    document.getElementById('cards').innerHTML = (CONTENT.steps || []).map((step, i) => `<div class="card" id="card-${i}"><div class="num">0${i + 1} ${step.label || ''}</div><h2>${step.title || ''}</h2><p>${step.desc || ''}</p></div>`).join('');
    setText('foot', CONTENT.footer || 'brief → content → render(t) → qa');
  }
  function render(t) {
    const time = Math.max(0, Math.min(DURATION, t));
    setText('sub', (CONTENT.subtitle || '').slice(0, Math.round((CONTENT.subtitle || '').length * ramp(time, DURATION * 0.08, DURATION * 0.22))));
    (CONTENT.steps || []).forEach((_, i) => document.getElementById(`card-${i}`).classList.toggle('on', time >= stepStart(i, CONTENT.steps.length)));
    document.getElementById('progress').style.width = ((time / DURATION) * 100).toFixed(3) + '%';
    setText('title', (CONTENT.title || '').slice(0, Math.round((CONTENT.title || '').length * ramp(time, 0, DURATION * 0.12))));
    const frame = Math.round(time * FPS);
    setText('ht', time.toFixed(2));
    setText('hf', String(frame) + ' / ' + TOTAL);
    const specStart = DURATION * 0.86;
    const spec = document.getElementById('spec');
    spec.style.opacity = time >= specStart ? ramp(time, specStart, DURATION * 0.06).toFixed(3) : 0;
    setText('spectitle', CONTENT.specTitle || `${DURATION.toFixed(1)} s / ${TOTAL} frames / ${FPS} fps`);
    setText('specsmall', CONTENT.specSubtitle || `${WIDTH}×${HEIGHT} · ${FPS} fps · render(t) deterministic`);
    return { t: time, frame };
  }
  layout();
  window.addEventListener('resize', () => { layout(); render(0); });
  window.render = render;
  window.__ready = true;
  render(0);
</script>
</body>
</html>
