<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VideoLab · bauhaus</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #efe7d6; }
  body { font-family: "Arial Black", "Microsoft YaHei", sans-serif; color: #17140f; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: linear-gradient(135deg, #f4eddd 0%, #e9dfcc 60%, #e0d4bd 100%); }
  .kicker { position: absolute; left: 4rem; top: 3.2rem; font: 700 .72rem/1 "Arial", sans-serif; letter-spacing: .34em; color: #b1402d; }
  h1 { position: absolute; left: 3.7rem; top: 4.4rem; margin: 0; font: 900 4.2rem/1.02 "Arial Black", sans-serif; letter-spacing: -.02em; max-width: 54rem; }
  h1 em { font-style: normal; color: #b1402d; }
  .sub { position: absolute; left: 4rem; top: 12.6rem; font: 600 1rem/1.6 "Arial", sans-serif; letter-spacing: .04em; color: #453b2c; }
  .hud { position: absolute; right: 3rem; top: 2.6rem; text-align: right; font: 700 .64rem/1.8 "Arial", sans-serif; letter-spacing: .12em; color: #6e604d; }
  .hud b { color: #b1402d; }
  .steps { position: absolute; left: 4rem; bottom: 3.2rem; display: flex; gap: .8rem; }
  .step { width: 14rem; padding: .8rem .9rem; background: #17140f; color: #f4eddd; }
  .step:nth-child(2) { background: #b1402d; }
  .step:nth-child(3) { background: #2762a8; }
  .step .n { font: 700 .58rem/1 "Arial", sans-serif; letter-spacing: .2em; opacity: .65; }
  .step .t { margin-top: .5rem; font: 800 .92rem/1.3 "Arial Black", sans-serif; }
  .step .d { margin-top: .35rem; font: 500 .64rem/1.6 "Arial", sans-serif; opacity: .78; }
  .spec { position: absolute; right: 3rem; bottom: 3.2rem; text-align: right; font: 700 .64rem/1.8 "Arial", sans-serif; color: #6e604d; }
  .spec b { color: #17140f; }
  .shape { position: absolute; }
  .circle { border-radius: 50%; }
  #c1 { width: 19rem; height: 19rem; right: 5rem; top: 3.4rem; background: #d8a21e; }
  #c2 { width: 13rem; height: 13rem; right: 18rem; top: 13rem; background: #b1402d; }
  #c3 { width: 9rem; height: 9rem; right: 3rem; top: 20rem; background: #2762a8; border-radius: 0; transform: rotate(12deg); }
  svg { position: absolute; left: 6rem; bottom: 8.8rem; width: 34rem; height: 18rem; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="hud"><div>BAUHAUS / SPECTRUM</div><div>t <b id="ht">0.00</b>s · frame <b id="hf">0</b></div><div id="hspec"></div></div>
  <div class="shape circle" id="c1"></div>
  <div class="shape circle" id="c2"></div>
  <div class="shape" id="c3"></div>
  <svg viewBox="0 0 620 320" aria-hidden="true">
    <polygon id="prism" points="230,230 330,40 430,230" fill="#17140f" opacity="0"/>
    <line id="beam" x1="10" y1="170" x2="300" y2="170" stroke="#17140f" stroke-width="5" stroke-dasharray="0 500" opacity=".9"/>
    <g id="spectrum" stroke-width="5" fill="none">
      <line id="s1" x1="380" y1="140" x2="610" y2="60" stroke="#b1402d" stroke-dasharray="0 400"/>
      <line id="s2" x1="380" y1="145" x2="610" y2="88" stroke="#d8771e" stroke-dasharray="0 400"/>
      <line id="s3" x1="380" y1="150" x2="610" y2="116" stroke="#d8a21e" stroke-dasharray="0 400"/>
      <line id="s4" x1="380" y1="155" x2="610" y2="144" stroke="#3d8a4f" stroke-dasharray="0 400"/>
      <line id="s5" x1="380" y1="160" x2="610" y2="172" stroke="#2762a8" stroke-dasharray="0 400"/>
      <line id="s6" x1="380" y1="165" x2="610" y2="200" stroke="#5b3a8a" stroke-dasharray="0 400"/>
    </g>
    <text x="230" y="284" font="700 13px Arial" fill="#6e604d" letter-spacing="4">PRISM · 色散</text>
  </svg>
  <div class="steps" id="steps"></div>
  <div class="spec" id="spec"><div><b id="specTitle"></b></div><div id="specSub"></div></div>
</div>
<script>
  const C = __CONTENT_JSON__;
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const ramp = (t, start, len) => clamp((t - start) / len);
  const $ = (id) => document.getElementById(id);
  $('kicker').textContent = C.kicker || 'VIDEOLAB / BAUHAUS';
  $('title').innerHTML = C.title || '';
  $('sub').textContent = C.subtitle || '';
  $('specTitle').textContent = C.specTitle || '';
  $('specSub').textContent = C.specSubtitle || '';
  $('hspec').textContent = (C.specTitle || '').replace(' / ', ' · ');
  $('steps').innerHTML = (C.steps || []).map((s, i) => `<div class="step"><div class="n">${s.label || '0' + (i + 1)}</div><div class="t">${s.title || ''}</div><div class="d">${s.desc || ''}</div></div>`).join('');
  const TOTAL = Math.round(C.duration * C.fps);
  const dash = (id, p, len) => { const el = $(id); el.setAttribute('stroke-dasharray', `${(len * p).toFixed(2)} 500`); };
  function render(t) {
    const time = Math.max(0, Math.min(C.duration, t));
    $('ht').textContent = time.toFixed(2);
    $('hf').textContent = `${Math.round(time * C.fps)} / ${TOTAL}`;
    $('title').style.opacity = ramp(time, 0, 1.6).toFixed(3);
    $('sub').style.opacity = ramp(time, 1, 1.4).toFixed(3);
    $('c1').style.transform = `scale(${(0.7 + 0.3 * ramp(time, 0, 2)).toFixed(3)}) translate(${(20 * ramp(time, 0, 2)).toFixed(1)}px, ${(-12 * ramp(time, 0, 2)).toFixed(1)}px)`;
    $('c2').style.transform = `translate(${(-30 * ramp(time, 2, 3)).toFixed(1)}px, ${(10 * ramp(time, 2, 3)).toFixed(1)}px)`;
    $('c3').style.transform = `rotate(${(12 + 30 * ramp(time, 4, 3)).toFixed(1)}deg)`;
    $('prism').style.opacity = ramp(time, 2.4, 1.4).toFixed(3);
    dash('beam', ramp(time, 3, 1.8), 300);
    const p = ramp(time, 4.4, 4.5);
    for (let i = 1; i <= 6; i++) dash('s' + i, clamp(p - (i - 1) * 0.09), 380);
    $('spectrum').style.opacity = ramp(time, 4, .8).toFixed(3);
    $('spec').style.opacity = ramp(time, C.duration * .8, 1.2).toFixed(3);
  }
  window.render = render; window.__ready = true; render(0);
</script>
</body>
</html>
