<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VideoLab · blueprint</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #061423; }
  body { font-family: "Cascadia Code", "Segoe UI", monospace; color: #cfe9ff; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: radial-gradient(70rem 40rem at 65% 45%, #12395e 0%, #071a2e 62%, #030b14 100%); }
  .grid { position: absolute; inset: 0; opacity: .22;
    background-image: linear-gradient(#1f4f74 0.0625rem, transparent 0.0625rem), linear-gradient(90deg, #1f4f74 0.0625rem, transparent 0.0625rem);
    background-size: 3.2rem 3.2rem; }
  .frame { position: absolute; inset: 1.6rem; border: 1px solid #2a628c; }
  .corner { position: absolute; width: 1.2rem; height: 1.2rem; border-color: #62c7ff; border-style: solid; }
  .corner.tl { left: 1.6rem; top: 1.6rem; border-width: 2px 0 0 2px; }
  .corner.tr { right: 1.6rem; top: 1.6rem; border-width: 2px 2px 0 0; }
  .corner.bl { left: 1.6rem; bottom: 1.6rem; border-width: 0 0 2px 2px; }
  .corner.br { right: 1.6rem; bottom: 1.6rem; border-width: 0 2px 2px 0; }
  .kicker { position: absolute; left: 4.2rem; top: 3.2rem; font-size: .72rem; letter-spacing: .3em; color: #62c7ff; }
  h1 { position: absolute; left: 4rem; top: 4.5rem; margin: 0; font: 650 3.2rem/1.22 "Cascadia Code", monospace; color: #f4fbff; letter-spacing: .01em; }
  .sub { position: absolute; left: 4.1rem; top: 8.7rem; font-size: 1.05rem; color: #a8d2ec; letter-spacing: .06em; }
  .hud { position: absolute; right: 3.4rem; top: 3rem; text-align: right; font-size: .66rem; line-height: 1.9; color: #5d91b4; }
  .hud b { color: #bfe9ff; font-weight: 400; }
  .steps { position: absolute; left: 4rem; right: 4rem; bottom: 3.2rem; display: flex; gap: 1.1rem; }
  .step { flex: 1; border-top: 1px solid #2a628c; padding-top: .7rem; opacity: .35; }
  .step .n { font-size: .62rem; color: #62c7ff; letter-spacing: .2em; }
  .step .t { margin-top: .45rem; font-size: .86rem; color: #d6efff; }
  .step .d { margin-top: .3rem; font-size: .64rem; color: #6f9cba; line-height: 1.6; }
  .spec { position: absolute; right: 3.4rem; bottom: 7.4rem; border: 1px solid #2a628c; padding: .7rem 1rem; background: #061423cc; font-size: .68rem; line-height: 1.9; color: #8db9d6; }
  .spec b { color: #bfe9ff; font-weight: 400; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lbl { font: .62rem "Cascadia Code", monospace; fill: #6fa8c8; letter-spacing: .12em; }
  .lbl.bright { fill: #bfe9ff; }
  .titleline { stroke: #2a628c; stroke-width: 1; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <div class="frame"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="hud"><div>OPTICS / RAY TRACE</div><div>t <b id="ht">0.00</b>s · frame <b id="hf">0</b></div><div id="hspec"></div></div>
  <svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <line x1="80" y1="390" x2="1200" y2="390" stroke="#2a628c" stroke-width="1" stroke-dasharray="4 8"/>
    <text x="86" y="378" class="lbl">OPTICAL AXIS</text>
    <g id="lensMode">
      <g id="rays" stroke="#8fe0ff" stroke-width="2" fill="none">
        <line id="ray1" x1="300" y1="230" x2="760" y2="390" stroke-dasharray="0 1200"/>
        <line id="ray2" x1="300" y1="230" x2="760" y2="230" stroke-dasharray="0 1200"/>
        <line id="ray3" x1="760" y1="390" x2="1050" y2="550" stroke-dasharray="0 1200"/>
        <line id="ray4" x1="760" y1="230" x2="1050" y2="550" stroke-dasharray="0 1200"/>
        <line id="ray5" x1="760" y1="230" x2="1050" y2="300" stroke-dasharray="0 1200"/>
      </g>
      <ellipse id="lens" cx="760" cy="390" rx="54" ry="190" fill="#12395e66" stroke="#8fe0ff" stroke-width="2.2"/>
      <line id="object" x1="300" y1="390" x2="300" y2="230" stroke="#ffcf6b" stroke-width="3"/>
      <polygon id="objectHead" points="300,230 292,248 308,248" fill="#ffcf6b"/>
      <line id="image" x1="1050" y1="390" x2="1050" y2="550" stroke="#ffcf6b" stroke-width="3" opacity="0"/>
      <polygon id="imageHead" points="1050,550 1042,532 1058,532" fill="#ffcf6b" opacity="0"/>
      <circle id="focus" cx="912" cy="390" r="4" fill="#ffcf6b" opacity="0"/>
      <text id="focusLbl" x="902" y="420" class="lbl bright" opacity="0">F</text>
      <text x="296" y="218" class="lbl">OBJECT</text>
      <text id="imageLbl" x="1036" y="575" class="lbl" opacity="0">IMAGE</text>
      <text x="730" y="620" class="lbl">LENS · f = 152 mm</text>
    </g>
    <g id="nonlinearMode" opacity="0">
      <rect x="610" y="250" width="150" height="300" fill="#12395e88" stroke="#62c7ff" stroke-width="1.6"/>
      <text x="622" y="238" class="lbl bright">χ(2) / χ(3) MEDIUM</text>
      <path id="pumpWave" d="" fill="none" stroke="#8fe0ff" stroke-width="2" opacity="0"/>
      <line id="omegaIn" x1="120" y1="400" x2="610" y2="400" stroke="#8fe0ff" stroke-width="2" stroke-dasharray="0 600"/>
      <line id="shgRay" x1="760" y1="400" x2="1140" y2="190" stroke="#ffcf6b" stroke-width="2.4" stroke-dasharray="0 500"/>
      <line id="dfRay" x1="760" y1="400" x2="1140" y2="520" stroke="#ff8a5c" stroke-width="2.4" stroke-dasharray="0 500"/>
      <line id="sfRay" x1="760" y1="400" x2="1140" y2="330" stroke="#8fe0ff" stroke-width="2.4" stroke-dasharray="0 500"/>
      <text x="980" y="174" class="lbl bright">2ω · SHG</text>
      <text x="980" y="558" class="lbl">ω1 / ω2 · DFG</text>
      <text x="980" y="318" class="lbl">ω · SFM</text>
      <text x="120" y="374" class="lbl">PUMP ω</text>
      <text x="610" y="620" class="lbl">NONLINEAR RESPONSE · INTENSITY-DEPENDENT</text>
    </g>
    <line x1="80" y1="640" x2="1200" y2="640" class="titleline"/>
  </svg>
  <div class="steps" id="steps"></div>
  <div class="spec" id="spec"><div>SPEC <b id="specTitle"></b></div><div id="specSub"></div></div>
</div>
<script>
  const C = __CONTENT_JSON__;
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const ramp = (t, start, len) => clamp((t - start) / len);
  const $ = (id) => document.getElementById(id);
  $('kicker').textContent = C.kicker || 'VIDEOLAB / BLUEPRINT';
  $('title').textContent = C.title || '';
  $('sub').textContent = C.subtitle || '';
  $('specTitle').textContent = C.specTitle || '';
  $('specSub').textContent = C.specSubtitle || '';
  $('hspec').textContent = (C.specTitle || '').replace(' / ', ' · ');
  $('steps').innerHTML = (C.steps || []).map((s, i) => `<div class="step" id="step${i}"><div class="n">${s.label || '0' + (i + 1)}</div><div class="t">${s.title || ''}</div><div class="d">${s.desc || ''}</div></div>`).join('');
  const TOTAL = Math.round(C.duration * C.fps);
  const nonlinear = C.visual === 'nonlinear';
  $('lensMode').style.display = nonlinear ? 'none' : '';
  $('nonlinearMode').style.display = nonlinear ? '' : 'none';
  $('nonlinearMode').setAttribute('opacity', nonlinear ? '1' : '0');
  $('pumpWave').setAttribute('d', 'M120 400 Q150 365 180 400 T240 400 T300 400 T360 400 T420 400 T480 400 T540 400 T600 400');
  function drawLine(id, p, length) { const el = $(id); el.setAttribute('stroke-dasharray', `${(length * p).toFixed(2)} 1200`); }
  function render(t) {
    const time = Math.max(0, Math.min(C.duration, t));
    $('ht').textContent = time.toFixed(2);
    $('hf').textContent = `${Math.round(time * C.fps)} / ${TOTAL}`;
    $('title').style.opacity = ramp(time, 0, 1.4).toFixed(3);
    $('sub').style.opacity = ramp(time, .7, 1.6).toFixed(3);
    const p1 = ramp(time, 2, 3.2), p2 = ramp(time, 5, 3.2);
    if (nonlinear) {
      drawLine('omegaIn', p1, 500);
      drawLine('shgRay', ramp(time, 4, 2.4), 420);
      drawLine('dfRay', ramp(time, 5.5, 2.4), 420);
      drawLine('sfRay', ramp(time, 7, 2.4), 420);
      $('pumpWave').style.opacity = p1.toFixed(3);
    } else {
      drawLine('ray1', p1, 500); drawLine('ray2', p1, 460);
      drawLine('ray3', p2, 380); drawLine('ray4', p2, 430);
      drawLine('ray5', p2, 320);
      $('lens').style.opacity = ramp(time, 1.2, 1.2).toFixed(3);
      $('image').style.opacity = p2.toFixed(3); $('imageHead').style.opacity = p2.toFixed(3); $('imageLbl').style.opacity = p2.toFixed(3);
      $('focus').style.opacity = p2.toFixed(3); $('focusLbl').style.opacity = p2.toFixed(3);
    }
    for (let i = 0; i < 3; i++) { const el = document.getElementById('step' + i); if (el) el.style.opacity = (.35 + .65 * ramp(time, 2 + i * 3.2, 1.4)).toFixed(3); }
    $('spec').style.opacity = ramp(time, C.duration * .82, 1.2).toFixed(3);
  }
  window.render = render; window.__ready = true; render(0);
</script>
</body>
</html>
