<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VideoLab loop smoke</title>
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; background: #0f1512; }
  body { font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; color: #e8f0ea; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden;
    background: radial-gradient(1200px 620px at 22% 12%, #1d3b2f 0%, #0f1512 62%, #0a0f0d 100%); }
  .grid { position: absolute; inset: 0; opacity: .16;
    background-image: linear-gradient(#79a58e22 1px, transparent 1px), linear-gradient(90deg, #79a58e22 1px, transparent 1px);
    background-size: 64px 64px; }
  .kicker { position: absolute; left: 96px; top: 116px; font-size: 15px; letter-spacing: .34em; color: #7fb79b; }
  h1 { position: absolute; left: 92px; top: 146px; margin: 0; font-size: 62px; line-height: 1.16; font-weight: 650; letter-spacing: .02em; }
  .sub { position: absolute; left: 96px; top: 258px; font-size: 21px; color: #a9c9b8; line-height: 1.7; }
  .cards { position: absolute; left: 96px; top: 352px; display: flex; gap: 20px; }
  .card { width: 246px; padding: 20px 22px; border: 1px solid #2c463a; border-radius: 12px; background: #13211b; }
  .card .num { font: 600 13px/1 Consolas, monospace; color: #7fb79b; letter-spacing: .16em; }
  .card h2 { margin: 12px 0 6px; font-size: 22px; font-weight: 600; }
  .card p { margin: 0; font-size: 13px; color: #89a795; line-height: 1.65; }
  .card.on { border-color: #58b184; background: #173126; box-shadow: 0 0 0 1px #58b18433, 0 12px 40px #1f6f4f22; }
  .bar { position: absolute; left: 96px; right: 96px; bottom: 128px; height: 6px; background: #24362d; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3f9d72, #8fe0b3); }
  .hud { position: absolute; right: 40px; top: 34px; text-align: right; font: 12px/1.9 Consolas, monospace; color: #739184; }
  .hud b { color: #c7e5d5; font-weight: 600; }
  .dot { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #9be8bd; box-shadow: 0 0 24px #6bd7a2aa; }
  .foot { position: absolute; left: 96px; bottom: 74px; font: 12px/1.6 Consolas, monospace; color: #6f8b7d; }
  .spec { position: absolute; inset: 0; display: grid; place-items: center; background: #0b110ee6; opacity: 0; }
  .spec-inner { text-align: center; }
  .spec-inner .big { font: 600 40px/1.3 "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: .04em; }
  .spec-inner .small { margin-top: 16px; font: 15px/1.9 Consolas, monospace; color: #9cc2ae; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <div class="kicker">VIDEOLAB / CONTRACT SMOKE</div>
  <h1>最小真实闭环</h1>
  <div class="sub" id="sub"></div>
  <div class="cards">
    <div class="card" id="c0"><div class="num">01 BRIEF</div><h2>需求</h2><p>受众、目标、深度与规格先写清楚</p></div>
    <div class="card" id="c1"><div class="num">02 RENDER</div><h2>确定性渲染</h2><p>画面只由时间 t 决定，逐帧截图</p></div>
    <div class="card" id="c2"><div class="num">03 QA</div><h2>检查</h2><p>规格、解码、抽检与 NOT CHECKED</p></div>
  </div>
  <div class="bar"><i id="progress"></i></div>
  <div class="dot" id="dot"></div>
  <div class="hud">
    <div>t <b id="ht">0.00</b> s · frame <b id="hf">0</b> / 240</div>
    <div>30 fps · 1280×720 · seed 42</div>
    <div>renderer: chromium + ffmpeg</div>
  </div>
  <div class="foot" id="foot">brief → outline → render(t) → frames → encode → qa</div>
  <div class="spec" id="spec"><div class="spec-inner"><div class="big" id="spectitle">8.000 s / 240 frames</div><div class="small" id="specsmall"></div></div></div>
</div>
<script>
  const DURATION = 8, FPS = 30, TOTAL = DURATION * FPS;
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const ramp = (t, start, len) => clamp01((t - start) / len);
  const subText = 'Brief → 分镜/大纲 → render(t) 逐帧 → ffmpeg 编码 → QA 清单';
  const subEl = document.getElementById('sub');
  function render(t) {
    const time = Math.max(0, Math.min(DURATION, t));
    subEl.textContent = subText.slice(0, Math.round(subText.length * ramp(time, 0.5, 1.6)));
    const cards = ['c0', 'c1', 'c2'];
    const starts = [1.6, 3.4, 5.6];
    cards.forEach((id, i) => document.getElementById(id).classList.toggle('on', time >= starts[i]));
    document.getElementById('progress').style.width = ((time / DURATION) * 100).toFixed(3) + '%';
    const dot = document.getElementById('dot');
    dot.style.left = (96 + (time / DURATION) * 1088).toFixed(2) + 'px';
    dot.style.top = (330 + Math.sin(time * 2.4) * 26).toFixed(2) + 'px';
    dot.style.opacity = ramp(time, 0.2, 0.8).toFixed(3);
    const frame = Math.round(time * FPS);
    document.getElementById('ht').textContent = time.toFixed(2);
    document.getElementById('hf').textContent = String(frame);
    document.getElementById('foot').textContent =
      `brief → outline → render(${time.toFixed(2)}) → frames → encode → qa`;
    if (time >= 6.9) {
      const spec = document.getElementById('spec');
      spec.style.opacity = ramp(time, 6.9, 0.5).toFixed(3);
      document.getElementById('spectitle').textContent = '8.000 s / 240 frames / 30 fps / 1280×720';
      document.getElementById('specsmall').textContent =
        `silent picture + click track · seed 42 · t=${time.toFixed(2)}s`;
    } else {
      document.getElementById('spec').style.opacity = 0;
    }
    return { t: time, frame };
  }
  window.render = render;
  window.__ready = true;
  render(0);
</script>
</body>
</html>
