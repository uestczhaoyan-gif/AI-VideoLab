name: 🐞 Bug 报告
description: 报告可复现的缺陷（安装、catalog、工作台、CLI 入口、文档链接或检查脚本）
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。VideoLab 是**本地优先的 AI 视频制作工作台 + 知识库**，不是 SaaS，也不是模型服务或生成 API。
        提交前请先看 [使用与排错文档](https://github.com/uestczhaoyan-gif/AI-VideoLab/blob/main/docs/README.md) 与 [工作台说明](https://github.com/uestczhaoyan-gif/AI-VideoLab/blob/main/apps/workbench/README.md)。

        安全漏洞请**不要**用公开 Issue 报告，改用[私下报告](https://github.com/uestczhaoyan-gif/AI-VideoLab/security/advisories/new)。

  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 一两句话说明发生了什么，以及你期望的结果。
      placeholder: 例如：在 Node 22 下运行 `npm run catalog:check` 报 Schema 错误；同一命令在 Node 24 下通过。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写出实际执行的命令；涉及本机缓存时说明是否已恢复上游快照。
      placeholder: |
        1. git status --short（确认基线）
        2. npm ci --ignore-scripts
        3. npm run catalog:check
        4. 看到错误……
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: 期望结果 vs 实际结果
      description: 贴出关键输出（请脱敏，不要包含密钥、私人路径或未公开稿件全文）。
      placeholder: 期望：命令以 0 退出并输出 "Catalog valid"；实际：以 1 退出并提示……
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      description: 选择最接近的一项；不确定就选「不确定」。
      options:
        - catalog 数据或校验
        - 工作台 Web 界面
        - 工作台只读服务（/api/*、媒体 Range）
        - CLI 启动入口（npm run cli）
        - 文档或相对链接
        - 工具与检查脚本（tools/）
        - 本地 demo / 案例资料
        - 不确定
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node 与 npm 版本、浏览器（涉及界面时）、以及是否在仓库根目录运行。
      placeholder: Windows 11 24H2；Node v24.17.0；npm 11.9.0；Edge 版本（如涉及界面）
    validations:
      required: true

  - type: textarea
    id: local-cache
    attributes:
      label: 本机缓存与上游快照状态
      description: 说明 `docs/theory/_sources/`、`demo/*/source/` 是否已按固定版本恢复；缺失缓存导致的“预览不可用”属于预期状态，不算缺陷。
      placeholder: 快照未恢复 / 已恢复固定版本；缺失时界面显示不可用，符合文档说明。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 相关日志、截图、命中的文档或代码位置；文件与媒体的实际授权范围。
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 这不是**未修复的安全漏洞**（安全漏洞走私下报告渠道，见 SECURITY.md）。
          required: true
        - label: 内容不含密钥、凭据、私人稿件、未授权素材或逐字 OCR 原文。
          required: true
        - label: 我没有把「有预览 / 已下载 / 技术检查通过」当成「可执行 / 已验收 / 可商用」。
          required: true
        - label: 我理解工作台只是本机只读服务，不是公开部署的生成 API。
          required: true
