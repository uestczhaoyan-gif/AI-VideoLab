# VideoLab 持续集成
#
# 只运行不需要浏览器、不需要本机资源快照、不访问外部服务的检查：
#   1. 依赖安装（--ignore-scripts）
#   2. catalog 结构、Schema、引用与安全路径
#   3. 项目 JSON Schema 生成物
#   4. 三条 recipe 执行器与示例语法
#   5. 单元测试（目录/契约/执行器结构/路由）
#   6. 整合 registry 是否最新、来源覆盖是否完整
#   7. Markdown 相对链接
#
# 不运行 `npm run make` / `loop:smoke`：真实渲染需要本机 Chrome/Edge 与 ffmpeg，
# 由维护者在本机执行并记录；CI 不下载浏览器与媒体。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (no lifecycle scripts, no browser download)
        run: npm ci --ignore-scripts

      - name: Validate catalog schema, references and safe paths
        run: npm run catalog:check

      - name: Check recipe and renderer syntax
        run: npm run recipe:check

      - name: Verify generated project validator is current
        run: node tools/project/build-validator.mjs --check

      - name: Verify integration registry and resource coverage
        run: npm run integration:check

      - name: Verify template → prompt → workflow map is current
        run: npm run catalog:map:check

      - name: Run unit, catalog and contract tests
        run: npm test

      - name: Check Markdown relative file links
        run: npm run docs:check
